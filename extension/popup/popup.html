<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAVACH Protection</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="kavach-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="shield-icon">🛡️</span>
        <div>
          <h1 class="logo">KAVACH</h1>
          <p class="subtitle">Real-Time Threat Protection</p>
        </div>
      </div>
      <div class="backend-pill" id="backendStatus">
        <span class="dot"></span> Online
      </div>
    </header>

    <!-- Main Verdict Card -->
    <main class="content">
      <div class="url-bar">
        <span class="lock-icon" id="schemeIcon">🔒</span>
        <span class="url-text" id="targetUrl">Inspecting tab...</span>
      </div>

      <div class="verdict-card" id="verdictCard">
        <div class="status-badge" id="statusBadge">ANALYZING</div>
        <div class="score-display">
          <span class="score-val" id="scoreVal">--</span>
          <span class="score-max">/100 Risk</span>
        </div>
      </div>

      <!-- Indicators Breakdown -->
      <section class="section">
        <h3 class="section-title">Security Indicators</h3>
        <ul class="indicator-list" id="indicatorList">
          <li class="indicator-item">Connecting to KAVACH Engine...</li>
        </ul>
      </section>

      <!-- Raksha AI Assessment -->
      <section class="section ai-section">
        <div class="ai-header">
          <span class="ai-sparkle">✨</span>
          <h3 class="section-title">Raksha AI Assessment</h3>
        </div>
        <p class="ai-summary" id="aiSummary">
          Raksha AI is evaluating the page structure, domain baseline, and threat telemetry...
        </p>
      </section>
    </main>

    <!-- Footer Actions -->
    <footer class="footer">
      <button class="btn btn-secondary" id="rescanBtn">Re-scan</button>
      <button class="btn btn-primary" id="openDashboardBtn">Open KAVACH SOC</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
