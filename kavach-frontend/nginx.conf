# ==============================================================================
# KAVACH Sovereign SOAR-XDR — Production Nginx Configuration
# Domain: kavachcybertech.in, www.kavachcybertech.in, api.kavachcybertech.in
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80) — Serves static content & handles Let's Encrypt challenges
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name kavachcybertech.in www.kavachcybertech.in api.kavachcybertech.in localhost _;

    root /usr/share/nginx/html;
    index index.html user.html;
    client_max_body_size 50M;

    # Let's Encrypt ACME challenge endpoint
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https: blob: cid:; connect-src 'self' ws: wss: http: https:;" always;

    # Clean URL Rewrites for KAVACH Web App Routes
    location = /dashboard { rewrite ^ /user.html last; }
    location = /user { rewrite ^ /user.html last; }
    location = /soc { rewrite ^ /soc.html last; }
    location = /analyst { rewrite ^ /soc.html last; }
    location = /admin { rewrite ^ /admin.html last; }
    location = /login { rewrite ^ /login.html last; }
    location = /admin-login { rewrite ^ /admin-login.html last; }
    location = /raksha { rewrite ^ /raksha-ai.html last; }
    location = /raksha-ai { rewrite ^ /raksha-ai.html last; }
    location = /features { rewrite ^ /features.html last; }
    location = /how-it-works { rewrite ^ /how-it-works.html last; }
    location = /about { rewrite ^ /about.html last; }
    location = /contact { rewrite ^ /contact.html last; }
    location = /download { rewrite ^ /download.html last; }
    location = /security { rewrite ^ /security.html last; }
    location = /privacy { rewrite ^ /privacy.html last; }
    location = /terms { rewrite ^ /terms.html last; }
    location = /get-started { rewrite ^ /get-started.html last; }

    # Static Assets
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy to FastAPI Backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # WebSocket Proxy for Real-Time Telemetry & Alerts
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server (Port 443) — High-Performance TLS 1.2 / TLS 1.3
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kavachcybertech.in www.kavachcybertech.in api.kavachcybertech.in localhost _;

    # SSL Certificates (Auto-bootstrapped by docker-entrypoint.sh, replaced by Certbot)
    ssl_certificate /etc/nginx/ssl/kavach.crt;
    ssl_certificate_key /etc/nginx/ssl/kavach.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html user.html;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Hardened Security Headers (HSTS enabled once CA-signed SSL is active)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https: blob: cid:; connect-src 'self' ws: wss: http: https:;" always;

    # Clean URL Rewrites for KAVACH Web App Routes
    location = /dashboard { rewrite ^ /user.html last; }
    location = /user { rewrite ^ /user.html last; }
    location = /soc { rewrite ^ /soc.html last; }
    location = /analyst { rewrite ^ /soc.html last; }
    location = /admin { rewrite ^ /admin.html last; }
    location = /login { rewrite ^ /login.html last; }
    location = /admin-login { rewrite ^ /admin-login.html last; }
    location = /raksha { rewrite ^ /raksha-ai.html last; }
    location = /raksha-ai { rewrite ^ /raksha-ai.html last; }
    location = /features { rewrite ^ /features.html last; }
    location = /how-it-works { rewrite ^ /how-it-works.html last; }
    location = /about { rewrite ^ /about.html last; }
    location = /contact { rewrite ^ /contact.html last; }
    location = /download { rewrite ^ /download.html last; }
    location = /security { rewrite ^ /security.html last; }
    location = /privacy { rewrite ^ /privacy.html last; }
    location = /terms { rewrite ^ /terms.html last; }
    location = /get-started { rewrite ^ /get-started.html last; }

    # Static Assets
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy to FastAPI Backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # WebSocket Proxy for Real-Time Telemetry & Alerts
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}
