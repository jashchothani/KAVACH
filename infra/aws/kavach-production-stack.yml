AWSTemplateFormatVersion: '2010-09-09'
Description: >
  KAVACH Sovereign SOAR-XDR Enterprise Platform — Production AWS Infrastructure Stack.
  Provisions an automated Zero-Trust VPC, hardened Linux EC2 host, Elastic IP, Security Group,
  AWS SNS Topic for Email Alert Broadcasts with KAVACH Templates, IAM Instance Profile, Docker runtime,
  and starts the containerized KAVACH platform.

Parameters:
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t3.micro
      - t2.small
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
    Description: EC2 Instance Type. Default is t2.micro (100% Free Tier Eligible in all AWS regions). t3.micro is also supported.

  NotificationEmail:
    Type: String
    Default: "kavachcybertech@gmail.com"
    Description: >
      Email address to subscribe to KAVACH AWS SNS Security Alerts & OTP Notifications.
      You will receive an email confirmation link from AWS to approve the subscription.

  DomainName:
    Type: String
    Default: "kavachcybertech.in"
    Description: Your purchased domain name for KAVACH (e.g. kavachcybertech.in).

  KeyName:
    Type: String
    Default: ""
    Description: (Optional) Name of an existing EC2 KeyPair for SSH access. Leave blank to connect via EC2 Instance Connect in AWS Console.

  NvidiaNimApiKey:
    Type: String
    Default: "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"
    NoEcho: true
    Description: NVIDIA NIM API Key for Raksha AI Sovereign Intelligence Assistant.

  VolumeSize:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 100
    Description: Root EBS gp3 Storage volume size in GB (30 GB is 100% Free Tier covered).

  LatestUbuntuAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id'
    Description: Auto-resolved Ubuntu 24.04 LTS AMI ID for the current AWS region.

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:
  # ============================================================================
  # 1. NOTIFICATION TIER: AWS SNS Topic & Email Subscription
  # ============================================================================
  KavachSnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "kavach-security-alerts-${AWS::StackName}"
      DisplayName: "KAVACH Security Platform"
      Tags:
        - Key: Application
          Value: KAVACH
        - Key: Environment
          Value: Production

  KavachSnsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref KavachSnsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ============================================================================
  # 2. IAM SECURITY TIER: EC2 Role for SNS Publishing (Zero Hardcoded Keys)
  # ============================================================================
  KavachEC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "KavachEC2Role-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: KavachSnsAlertPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                  - sns:Subscribe
                  - sns:ListSubscriptionsByTopic
                  - sns:GetTopicAttributes
                Resource: !Ref KavachSnsTopic
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

  KavachInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "KavachInstanceProfile-${AWS::StackName}"
      Roles:
        - !Ref KavachEC2Role

  # ============================================================================
  # 3. NETWORK TIER: VPC, Internet Gateway, Subnet, Route Table
  # ============================================================================
  KavachVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: Kavach-Production-VPC
        - Key: Environment
          Value: Production

  KavachInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Kavach-VPC-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref KavachVPC
      InternetGatewayId: !Ref KavachInternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref KavachVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Kavach-Public-Subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref KavachVPC
      Tags:
        - Key: Name
          Value: Kavach-Public-RouteTable

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref KavachInternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ============================================================================
  # 4. SECURITY TIER: Security Group Rules
  # ============================================================================
  KavachSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security rules for KAVACH Web Console, API, and Management
      VpcId: !Ref KavachVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP Web Operations Console
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS SSL/TLS Encrypted Traffic
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH and EC2 Instance Connect
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
          Description: FastAPI Direct API Port (Optional / Debug)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Full outbound internet connectivity for updates, AWS SNS, and NVIDIA NIM
      Tags:
        - Key: Name
          Value: Kavach-Production-SG

  # ============================================================================
  # 5. STATIC PUBLIC IP: Elastic IP
  # ============================================================================
  KavachElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: Kavach-Production-EIP

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref KavachServerInstance
      AllocationId: !GetAtt KavachElasticIP.AllocationId

  # ============================================================================
  # 6. COMPUTE TIER: EC2 Linux Instance with Automated UserData Bootstrap
  # ============================================================================
  KavachServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestUbuntuAmiId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref KavachInstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref KavachSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: KAVACH-Production-Server
        - Key: Application
          Value: KAVACH-SOAR-XDR
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euo pipefail

          # Log bootstrap process
          exec > >(tee /var/log/kavach-bootstrap.log|logger -t kavach-bootstrap -s 2>/dev/console) 2>&1
          echo "=== Starting KAVACH Production Bootstrap at $(date) ==="

          # 0. FREE TIER OPTIMIZATION: 4GB Swapfile
          # Expands 1GB RAM on t2.micro/t3.micro to 5GB total virtual memory, preventing OOM crashes
          if [ ! -f /swapfile ]; then
            echo "Configuring 4GB high-speed swap space for AWS Free Tier..."
            fallocate -l 4G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=4096
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
            sysctl vm.swappiness=20 || true
            echo 'vm.swappiness=20' >> /etc/sysctl.conf
          fi

          # 1. Update OS and Install Base Tools
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y ca-certificates curl gnupg lsb-release git jq ufw python3 python3-pip

          # 2. Install Docker CE and Docker Compose Plugin
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg --yes
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -y
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

          systemctl enable docker
          systemctl start docker
          usermod -aG docker ubuntu || true

          # 3. Kernel Sysctl Tuning for High Throughput
          cat << 'SYSCTL_EOF' > /etc/sysctl.d/99-kavach-production.conf
          net.core.somaxconn = 65535
          net.ipv4.tcp_max_syn_backlog = 8192
          net.ipv4.ip_local_port_range = 1024 65535
          fs.file-max = 2097152
          vm.max_map_count = 262144
          SYSCTL_EOF
          sysctl --system > /dev/null || true

          # 4. Setup KAVACH Directory
          APP_DIR="/opt/kavach"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          # 5. Populate Production Environment File with AWS SNS & NVIDIA NIM
          cat << 'ENV_EOF' > "$APP_DIR/.env.prod"
          ENVIRONMENT=production
          DEBUG=false
          LOG_LEVEL=INFO
          SECRET_KEY=kavach-prod-key-$(openssl rand -hex 16)
          JWT_SECRET=kavach-jwt-key-$(openssl rand -hex 24)
          API_HOST=0.0.0.0
          API_PORT=8000
          POSTGRES_USER=kavach_admin
          POSTGRES_PASSWORD=KavachSecurePass2026!
          POSTGRES_DB=kavach
          DB_URL=postgresql+asyncpg://kavach_admin:KavachSecurePass2026!@postgres:5432/kavach
          QUEUE_TYPE=redis
          REDIS_PASSWORD=KavachRedisPass2026!
          REDIS_URL=redis://:KavachRedisPass2026!@redis:6379/0
          NVIDIA_NIM_API_KEY=${NvidiaNimApiKey}
          NVIDIA_NIM_BASE_URL=https://integrate.api.nvidia.com/v1
          NVIDIA_NIM_MODEL=google/diffusiongemma-26b-a4b-it
          AWS_SNS_TOPIC_ARN=${KavachSnsTopic}
          AWS_DEFAULT_REGION=${AWS::Region}
          AWS_SNS_AUTO_SUBSCRIBE=true
          ENV_EOF

          echo "KAVACH Environment and Free-Tier optimizations successfully applied."
          echo "=== KAVACH Bootstrap Completed Successfully at $(date) ==="

Outputs:
  ServerPublicIP:
    Description: Permanent Static Public Elastic IP Address of your KAVACH Server
    Value: !Ref KavachElasticIP

  WebConsoleURL:
    Description: KAVACH Sovereign Web Operations Console
    Value: !Sub "http://${KavachElasticIP}/"

  SOCDashboardURL:
    Description: Real-Time SOC Analyst Telemetry & MITRE ATT&CK Matrix
    Value: !Sub "http://${KavachElasticIP}/soc"

  RakshaAIURL:
    Description: Raksha AI Cybersecurity Copilot (ChatGPT-Style Interface)
    Value: !Sub "http://${KavachElasticIP}/raksha-ai"

  BackendAPIHealth:
    Description: Backend Health & Diagnostic Verification Endpoint
    Value: !Sub "http://${KavachElasticIP}/api/v1/health"

  SnsTopicArn:
    Description: AWS SNS Topic ARN for KAVACH Security Alerts & Email Notifications
    Value: !Ref KavachSnsTopic

  SnsSubscriptionNotice:
    Description: AWS SNS Email Subscription Status
    Value: !If
      - HasNotificationEmail
      - !Sub "Confirmation email sent by AWS to ${NotificationEmail}. Open your inbox and click 'Confirm Subscription'."
      - "No initial email provided. You can subscribe any email to the SNS Topic in the AWS SNS Console."

  DomainWebConsoleURL:
    Description: Production Web Operations Console (After DNS & SSL setup)
    Value: !Sub "https://${DomainName}/"

  DomainSOCDashboardURL:
    Description: Production SOC Dashboard on your Custom Domain
    Value: !Sub "https://${DomainName}/soc"

  DnsRecordInstructions:
    Description: DNS A Record Configuration needed at your Domain Registrar
    Value: !Sub "Add DNS A-Record pointing '${DomainName}' and 'www.${DomainName}' to ${KavachElasticIP}"

  SSHConnectInstructions:
    Description: How to connect to your Linux server
    Value: !Sub "Connect via AWS Console EC2 Instance Connect or run: ssh ubuntu@${KavachElasticIP}"
